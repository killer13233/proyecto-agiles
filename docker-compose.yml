version: "3.9"

services:

  sqlserver-a:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Uta2026!Strong"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata-a:/var/opt/mssql
    networks:
      - uta-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Uta2026!Strong' -Q 'SELECT 1' -No -C || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  sqlserver-b:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Uta2026!Strong"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1434:1433"
    volumes:
      - sqldata-b:/var/opt/mssql
    networks:
      - uta-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Uta2026!Strong' -Q 'SELECT 1' -No -C || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  sqlserver-c:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Uta2026!Strong"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1435:1433"
    volumes:
      - sqldata-c:/var/opt/mssql
    networks:
      - uta-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Uta2026!Strong' -Q 'SELECT 1' -No -C || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  microservicio-a:
    build:
      context: ./src/MicroservicioA
      dockerfile: Dockerfile
    ports:
      - "8084:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      sqlserver-a:
        condition: service_healthy
    networks:
      - uta-network
    restart: on-failure

  microservicio-c:
    build:
      context: ./src/MicroservicioC
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      sqlserver-c:
        condition: service_healthy
    networks:
      - uta-network
    restart: on-failure

  microservicio-b:
    build:
      context: ./src/MicroservicioB
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      sqlserver-b:
        condition: service_healthy
      microservicio-c:
        condition: service_started # ← quitar esta línea si B no llama a C al arrancar
    networks:
      - uta-network
    restart: on-failure

  api-gateway:
    build:
      context: ./src/ApiGateway
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - microservicio-a
      - microservicio-b
      - microservicio-c
    networks:
      - uta-network
    restart: on-failure

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://192.168.100.20:8090
      - VITE_WS_URL=ws://192.168.100.20:8082
    networks:
      - uta-network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - VITE_API_URL=http://192.168.100.20:8090
      - VITE_WS_URL=ws://192.168.100.20:8082
    networks:
      - uta-network
    restart: on-failure

networks:
  uta-network:
    driver: bridge

volumes:
  sqldata-a:
  sqldata-b:
  sqldata-c:
